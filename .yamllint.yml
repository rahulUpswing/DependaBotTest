extends: default

rules:
  line-length: disable
  empty-lines: disable
  comments: disable
  comments-indentation: disable
  document-start: disable
  truthy: disable
  trailing-spaces: disable
  new-line-at-end-of-file: disable
  indentation: disable
  quoted-strings:
    level: error
    required: false
    extra-required:
      - '(?<!["\' ])[0-9]{15,}(?!["\'])'
    extra-allowed: []
    allow-quoted-quotes: false
    check-keys: false
    quote-type: any